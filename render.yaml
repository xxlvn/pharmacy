# Развёртывание на Render (https://render.com): Blueprint с одним веб-сервисом.
# База данных — PostgreSQL на Neon (https://neon.tech), строка подключения задаётся в DATABASE_URL.
services:
  - type: web
    name: pharmacy-myata
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # Письма восстановления пароля (Brevo, https://www.brevo.com): ключ API и подтверждённый адрес отправителя
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Мята
      # Адрес сайта для ссылок в письмах
      - key: APP_URL
        value: https://pharmacy-myata.onrender.com
