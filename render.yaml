# Развёртывание на Render (https://render.com): Blueprint с одним веб-сервисом.
# База данных — PostgreSQL на Neon (https://neon.tech), строка подключения задаётся в DATABASE_URL.
services:
  - type: web
    name: pharmacy-myata
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
