<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Мята — интернет-аптека</title>
  <meta name="description" content="Мята — интернет-аптека в Алматы: каталог лекарств, наличие и заказ с доставкой.">
  <meta name="theme-color" content="#192B1B">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <!-- SF Pro берётся из системы на устройствах Apple; на остальных — Inter (ближайший свободный аналог, есть казахские буквы) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">Перейти к содержимому</a>

  <header class="site-header">
    <div class="container header-row">
      <a class="logo" href="#/" data-i18n-aria="nav.home" aria-label="Мята — на главную">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="11" y="3" width="10" height="26" rx="3"/>
          <rect x="3" y="11" width="26" height="10" rx="3"/>
        </svg>
        <span data-i18n="brand">Мята</span>
      </a>

      <nav class="main-nav" data-i18n-aria="nav.main" aria-label="Основная навигация">
        <a href="#/" data-nav="catalog" data-i18n="nav.catalog">Каталог</a>
      </nav>

      <div class="header-actions">
        <div class="header-lang" role="group" data-header-lang></div>
        <a class="cart-link" href="#/cart" data-i18n-aria="nav.cart" aria-label="Корзина">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.7a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></svg>
          <span class="cart-count" data-cart-count hidden>0</span>
        </a>
        <div class="account" data-account></div>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="site-footer" data-footer></footer>

  <div class="toaster" aria-live="polite" aria-atomic="false" data-toaster></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
